<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-admin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0165b2"/>
      <stop offset="100%" stop-color="#014a82"/>
    </linearGradient>
  </defs>

  <!-- Main circle with blue gradient -->
  <circle cx="16" cy="16" r="15" fill="url(#grad-admin)">
    <!-- Subtle breathing scale -->
    <animateTransform attributeName="transform" type="scale" values="1; 0.95; 1" keyTimes="0; 0.5; 1" dur="2s" repeatCount="indefinite" additive="sum" transform-origin="16 16"/>
  </circle>

  <!-- Text -->
  <text x="50%" y="50%" dy=".35em" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="white">A</text>
</svg>
